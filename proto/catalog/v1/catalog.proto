syntax = "proto3";

package catalog.v1;

option go_package = "github.com/furnica/backend/gen/catalog/v1;catalogv1";

// CatalogService — поставщики, товарные карточки (номенклатура) и сопоставление
// сырых строк прайсов (supplier_offer) с карточками (product).
service CatalogService {
  rpc HealthCheck(HealthCheckRequest) returns (HealthCheckResponse);

  rpc CreateSupplier(CreateSupplierRequest) returns (Supplier);
  rpc UpdateSupplier(UpdateSupplierRequest) returns (Supplier);
  rpc DeleteSupplier(DeleteSupplierRequest) returns (DeleteSupplierResponse);
  rpc ListSuppliers(ListSuppliersRequest) returns (ListSuppliersResponse);

  // --- Номенклатура (products) ---
  rpc CreateProduct(CreateProductRequest) returns (Product);
  // ListProducts: без query — последние карточки; с query — триграммный поиск по имени.
  // category_id дополнительно сужает выборку категорией и всеми её подкатегориями.
  rpc ListProducts(ListProductsRequest) returns (ListProductsResponse);
  rpc GetProduct(GetProductRequest) returns (Product);
  // Назначить категорию нескольким карточкам (пустой category_id — снять).
  rpc SetProductCategory(SetProductCategoryRequest) returns (SetProductCategoryResponse);

  // --- Категории (дерево витрины) ---
  rpc ListCategories(ListCategoriesRequest) returns (ListCategoriesResponse);
  rpc CreateCategory(CreateCategoryRequest) returns (Category);
  rpc UpdateCategory(UpdateCategoryRequest) returns (Category);
  rpc DeleteCategory(DeleteCategoryRequest) returns (DeleteCategoryResponse);

  // --- Админ: очистка данных каталога (карточки, фото, сопоставления,
  // категории; опционально поставщики). Необратимо, доступ ограничивает gateway.
  rpc WipeData(WipeDataRequest) returns (WipeDataResponse);

  // --- Фото карточки (галерея, до 10 шт.) ---
  // Байты хранятся в Postgres; списки отдают только метаданные, содержимое — GetProductImage.
  rpc ListProductImages(ListProductImagesRequest) returns (ListProductImagesResponse);
  rpc AddProductImage(AddProductImageRequest) returns (ProductImage);
  rpc DeleteProductImage(DeleteProductImageRequest) returns (DeleteProductImageResponse);
  // Полный новый порядок фото карточки (все id, в нужной последовательности).
  rpc ReorderProductImages(ReorderProductImagesRequest) returns (ListProductImagesResponse);
  rpc GetProductImage(GetProductImageRequest) returns (GetProductImageResponse);

  // --- Сопоставление (matching) ---
  // Кандидаты для конкретных offer'ов (топ-N по similarity названия).
  rpc SuggestMatches(SuggestMatchesRequest) returns (SuggestMatchesResponse);
  // Несопоставленные строки батча + счётчики прогресса.
  rpc ListUnmatchedOffers(ListUnmatchedOffersRequest) returns (ListUnmatchedOffersResponse);
  // Подтвердить связку offer -> существующая карточка.
  rpc ConfirmMatch(ConfirmMatchRequest) returns (Match);
  // Создать новую карточку из offer и сразу подтвердить (кандидат не подошёл).
  rpc CreateProductFromOffer(CreateProductFromOfferRequest) returns (Match);
  // Снять сопоставление.
  rpc Unmatch(UnmatchRequest) returns (UnmatchResponse);
}

message HealthCheckRequest {}
message HealthCheckResponse {
  string status = 1;
  string service = 2;
}

enum SupplierType {
  SUPPLIER_TYPE_UNSPECIFIED = 0;
  SUPPLIER_TYPE_EXCEL = 1;   // прайсы файлами
  SUPPLIER_TYPE_API = 2;     // подключение по API
  SUPPLIER_TYPE_PARSING = 3; // парсинг сайта
}

message Supplier {
  string id = 1;
  string name = 2;
  SupplierType type = 3;
  string created_at = 4;
  string city = 5;
  string address = 6;
  string logo = 7;               // URL или data-URL логотипа
  string status = 8;             // new | active | inactive
}

message CreateSupplierRequest {
  string name = 1;
  SupplierType type = 2;
  string city = 3;
  string address = 4;
  string logo = 5;
  string status = 6;
}

message UpdateSupplierRequest {
  string id = 1;
  string name = 2;
  SupplierType type = 3;
  string city = 4;
  string address = 5;
  string logo = 6;
  string status = 7;
}

message DeleteSupplierRequest {
  string id = 1;
}

message DeleteSupplierResponse {
  bool ok = 1;
}

message ListSuppliersRequest {
  int32 page_size = 1;
  string page_token = 2;
}

message ListSuppliersResponse {
  repeated Supplier suppliers = 1;
  string next_page_token = 2;
}

// --- Номенклатура (products) ---

message Product {
  string id = 1;
  string name = 2;
  string article = 3;
  string created_at = 4;
  string image_url = 5;          // легаси: внешний URL фото (для старых карточек)
  string cover_image_id = 6;     // id первого фото галереи (пусто, если фото нет)
  string category_id = 7;        // категория витрины (пусто — без категории)
}

message CreateProductRequest {
  string name = 1;
  string article = 2;
  string image_url = 3;
  string category_id = 4;        // опц.: сразу положить в категорию
}

message ListProductsRequest {
  string query = 1;       // непустой -> триграммный поиск по имени
  int32 page_size = 2;
  // Непустой -> только эта категория и её подкатегории.
  // Спец-значение "none" -> только товары без категории.
  string category_id = 3;
}

message ListProductsResponse {
  repeated Product products = 1;
}

message GetProductRequest {
  string id = 1;
}

message SetProductCategoryRequest {
  repeated string product_ids = 1;
  string category_id = 2; // пусто — снять категорию
}

message SetProductCategoryResponse {
  int32 updated = 1;
}

// --- Категории ---

// Category — узел дерева категорий витрины.
message Category {
  string id = 1;
  string parent_id = 2;     // пусто — корневая
  string name = 3;
  int32 position = 4;       // порядок среди сиблингов
  int32 product_count = 5;  // товаров непосредственно в категории (без подкатегорий)
  string created_at = 6;
}

message ListCategoriesRequest {}

message ListCategoriesResponse {
  repeated Category categories = 1;   // плоский список, дерево собирает клиент
  int32 uncategorized_count = 2;      // товаров без категории (для пункта «Без категории»)
}

message CreateCategoryRequest {
  string name = 1;
  string parent_id = 2; // пусто — корневая
}

message UpdateCategoryRequest {
  string id = 1;
  string name = 2;
  string parent_id = 3; // пусто — сделать корневой
}

message DeleteCategoryRequest {
  string id = 1; // подкатегории удаляются каскадом, товары остаются без категории
}

message DeleteCategoryResponse {
  bool ok = 1;
}

// --- Очистка данных ---

message WipeDataRequest {
  bool include_suppliers = 1; // удалить и поставщиков
}

// WipeDataResponse — сколько строк удалено (для отчёта в UI).
message WipeDataResponse {
  int64 products = 1;
  int64 images = 2;
  int64 matches = 3;
  int64 categories = 4;
  int64 suppliers = 5;
}

// --- Фото карточки ---

// ProductImage — метаданные фото (без байтов: их отдаёт GetProductImage).
message ProductImage {
  string id = 1;
  string product_id = 2;
  int32 position = 3;
  string content_type = 4;
  string created_at = 5;
}

message ListProductImagesRequest {
  string product_id = 1;
}

message ListProductImagesResponse {
  repeated ProductImage images = 1;
}

message AddProductImageRequest {
  string product_id = 1;
  string content_type = 2; // image/jpeg | image/png | image/webp
  bytes data = 3;          // сжатое фото (клиент ресайзит до ~1600px)
  bytes thumb = 4;         // миниатюра для списков (~320px)
}

message DeleteProductImageRequest {
  string id = 1;
}

message DeleteProductImageResponse {
  bool ok = 1;
}

message ReorderProductImagesRequest {
  string product_id = 1;
  repeated string image_ids = 2; // все фото карточки в новом порядке
}

message GetProductImageRequest {
  string id = 1;
  bool thumb = 2; // true — отдать миниатюру
}

message GetProductImageResponse {
  string content_type = 1;
  bytes data = 2;
}

// --- Сопоставление (matching) ---

// Candidate — карточка-кандидат для строки прайса и её похожесть (0..1).
message Candidate {
  string product_id = 1;
  string product_name = 2;
  string product_article = 3;
  float score = 4;
}

// OfferSuggestion — сырая строка и подобранные под неё кандидаты.
message OfferSuggestion {
  string offer_id = 1;
  string raw_name = 2;
  string raw_article = 3;
  repeated Candidate candidates = 4;
}

message SuggestMatchesRequest {
  repeated string offer_ids = 1;
  int32 limit = 2;        // сколько кандидатов на строку (по умолчанию 5)
}

message SuggestMatchesResponse {
  repeated OfferSuggestion suggestions = 1;
}

// UnmatchedOffer — несопоставленная строка прайса.
message UnmatchedOffer {
  string offer_id = 1;
  int32 row_num = 2;
  string raw_name = 3;
  string raw_article = 4;
  double price = 5;
  string currency = 6;
}

message ListUnmatchedOffersRequest {
  string batch_id = 1;
  int32 page_size = 2;
}

message ListUnmatchedOffersResponse {
  repeated UnmatchedOffer offers = 1;
  int32 total = 2;        // всего строк в батче
  int32 matched = 3;      // из них сопоставлено
}

// Match — подтверждённая связка offer -> product.
message Match {
  string offer_id = 1;
  string product_id = 2;
  float score = 3;
  string matched_by = 4;
  string matched_at = 5;
}

message ConfirmMatchRequest {
  string offer_id = 1;
  string product_id = 2;
  string matched_by = 3; // email подтвердившего (проставляет gateway)
}

message CreateProductFromOfferRequest {
  string offer_id = 1;
  string name = 2;       // опц.: если пусто — берём raw_name строки
  string article = 3;    // опц.: если пусто — берём raw_article строки
  string matched_by = 4; // email подтвердившего (проставляет gateway)
}

message UnmatchRequest {
  string offer_id = 1;
}

message UnmatchResponse {
  bool ok = 1;
}
