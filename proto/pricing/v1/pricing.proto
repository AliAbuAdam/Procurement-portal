syntax = "proto3";

package pricing.v1;

option go_package = "github.com/furnica/backend/gen/pricing/v1;pricingv1";

// PricingService — цены, наличие, история и сравнение по товарной карточке.
service PricingService {
  rpc HealthCheck(HealthCheckRequest) returns (HealthCheckResponse);

  // Сравнение: по товару — цены всех поставщиков (фаза 3).
  rpc CompareByProduct(CompareByProductRequest) returns (CompareByProductResponse);

  // Витрина: минимальная базовая цена и число поставщиков по списку товаров
  // (для бейджа «от X ₽» на карточках каталога).
  rpc MinPricesByProducts(MinPricesByProductsRequest) returns (MinPricesByProductsResponse);
}

message HealthCheckRequest {}
message HealthCheckResponse {
  string status = 1;
  string service = 2;
}

message PriceOffer {
  string supplier_id = 1;
  string supplier_name = 2;
  double price = 3;       // базовая (розничная) цена
  string currency = 4;
  bool in_stock = 5;
  int64 stock_qty = 6;
  string updated_at = 7;
  double price_opt = 8;   // оптовая цена (0 = поставщик не дал)
  double price_bulk = 9;  // крупный опт (0 = поставщик не дал)
}

message CompareByProductRequest {
  string product_id = 1;
  // Уровень цены для сравнения: base (по умолчанию) | opt | bulk.
  // Самый дешёвый ищется среди поставщиков, у которых эта цена задана.
  string price_tier = 2;
}

message CompareByProductResponse {
  string product_id = 1;
  repeated PriceOffer offers = 2;
  string cheapest_supplier_id = 3;
}

// ProductMinPrice — сводка по товару для карточки витрины.
message ProductMinPrice {
  string product_id = 1;
  double min_price = 2;     // минимальная базовая цена среди поставщиков (0 — цен нет)
  string currency = 3;      // валюта минимальной цены
  int32 supplier_count = 4; // сколько поставщиков дают этот товар
  bool in_stock = 5;        // есть ли товар в наличии хотя бы у одного поставщика
}

message MinPricesByProductsRequest {
  repeated string product_ids = 1; // до 200 за запрос
}

message MinPricesByProductsResponse {
  repeated ProductMinPrice prices = 1; // только товары, у которых есть предложения
}
